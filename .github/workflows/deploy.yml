name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy-app:
    name: Deploy app to Cloudflare
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # `opennextjs-cloudflare deploy` (used by `npm run deploy:cloudflare`) also tries to
      # pre-populate the R2 incremental cache through a temporary Worker tunnel before
      # deploying. That tunnel has been unreliable from GitHub-hosted runners (requests
      # time out and retry indefinitely). The cache fills itself on real requests, so in CI
      # we skip that step. `wrangler deploy` auto-delegates back to `opennextjs-cloudflare
      # deploy` whenever it detects an OpenNext project unless OPEN_NEXT_DEPLOY is already
      # set (the same loop-guard OpenNext sets internally) — setting it ourselves here is
      # what makes this a genuinely plain deploy.
      - run: npx wrangler deploy
        env:
          OPEN_NEXT_DEPLOY: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-supabase:
    name: Deploy Supabase schema and functions
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --project-ref targets the hosted project directly, so no `supabase link` /
      # local link state is needed in a stateless CI runner.
      - run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - run: |
          supabase functions deploy public-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy customer-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy admin-api --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
